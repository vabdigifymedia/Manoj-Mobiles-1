<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>You're Offline — Manoj Mobiles</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f9f9f8;color:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:2rem;text-align:center}
    .container{max-width:380px}
    .icon{width:80px;height:80px;margin:0 auto 1.5rem;background:#000000;border-radius:1.25rem;display:grid;place-items:center}
    .icon svg{color:#fff}
    h1{font-size:1.5rem;font-weight:900;margin-bottom:.5rem}
    p{color:#6b7280;font-size:.875rem;line-height:1.6;margin-bottom:2rem}
    button{background:#000000;color:#fff;border:none;padding:.75rem 2rem;border-radius:.75rem;font-size:.875rem;font-weight:700;cursor:pointer;transition:opacity .2s}
    button:active{opacity:.7;transform:scale(.97)}
    @media(prefers-color-scheme:dark){
      body{background:#09090b;color:#fafafa}
      p{color:#a1a1aa}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" x2="22" y1="2" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><line x1="12" x2="12.01" y1="20" y2="20"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>It looks like your internet connection dropped. Please check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
